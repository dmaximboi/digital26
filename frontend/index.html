      <h1>The Digital 26 - Vibe Coding Studio</h1>
      <p>The Digital 26 is a vibe coding studio. We build websites and apps, train students, and take client work: payment systems, tracking dashboards, order management, mapping platforms, booking systems, e-commerce, portfolios, and more.</p>
      <p>We deliver faster and cheaper than any freelancing platform. We have senior web and app engineers who review every codebase for security, performance, and quality. We are always available for work worldwide.</p>
      <h2>Student Training Programme</h2>
      <p>We train students in vibe coding, prompt engineering, web development, and deployment. Programme length is flexible: 5 months, 6 months, or any duration depending on student availability. Classes are both physical and online, your choice. Students learn with convenience and ease at affordable prices.</p>
      <p>After completing your project, you receive a publicly verifiable Certificate of Participation or Completion with a QR code and public ID that anyone can verify on this site.</p>
      <h2>Client Agreements</h2>
      <p>Every client deal is backed by a service agreement letter with public verification. We are open, transparent, and accountable.</p>
      <h2>Tech dictionary</h2>
      <p>Looking for tech terms, a programming glossary, or software terminology? The public Digital 26 dictionary is at <a href="/dictionary">/dictionary</a>. Free to read. Search Git, GitHub, HTTP, JavaScript, CSS, security, and studio words. Also at /glossary, /tech-dictionary, /tech-terms, and /terminology. Machine list: <a href="/dictionary.md">/dictionary.md</a>.</p>
      <h2>How Google Sign-In is used</h2>
      <p>Students sign in with their Google account to manage applications, track weekly attendance, and communicate. No passwords are stored. Google verifies your identity securely.</p>
